name: Notify Collaborators on Import

on:
  repository_dispatch:
    types: [success, error]

jobs:
  notify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Notify collaborators
        uses: actions/github-script@v7
        with:
          script: |
            const eventType = context.payload.action;
            const payload = context.payload.client_payload || {};

            const { data: collaborators } = await github.rest.repos.listCollaborators({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            if (!collaborators.length) {
              core.info("No collaborators found.");
              return;
            }

            const mentions = collaborators.map(c => `@${c.login}`).join(' ');

            let title, body;

            if (eventType === "success") {
              title = "Import Completed ✅";
              body = `🚀 Import finished successfully for ${payload.integration_type}. Details: ${payload.message || "No details provided"} Notifying: ${mentions}`;
            } else if (eventType === "error") {
              title = "Import Failed ❌";
              body = `❗ Import failed at ${payload.errored_integration_type}. Error: ${payload.errored_message || "Unknown error"} \n Action: ${payload.errored_action} \n Step: ${payload.errored_step} \n Notifying: ${mentions}`;
            } else {
              core.setFailed(`Unhandled event type: ${eventType}`);
              return;
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });

            core.info(`Issue created: ${issue.data.html_url}`);
